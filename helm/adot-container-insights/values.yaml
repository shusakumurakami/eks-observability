# Default values for adot-container-insights
# These values can be overridden in values/values-{env}.yaml

# AWS Configuration
aws:
  region: ap-northeast-1
  clusterName: ""  # Required: EKS cluster name

# IRSA (IAM Roles for Service Accounts)
serviceAccount:
  name: adot-collector-container-insights
  roleArn: ""  # Required: IAM role ARN for Container Insights (from Terraform output)

# Namespace configuration
namespace:
  name: aws-otel-eks
  create: true  # Set to false if namespace is already created by adot-prometheus chart

# Resource naming
# These names are customized to avoid conflicts with adot-prometheus chart
resources:
  configMapName: adot-collector-container-insights-config
  serviceName: adot-collector-container-insights-service
  containerName: adot-collector-container-insights
  # Label used for component identification
  componentLabel: adot-collector-container-insights
