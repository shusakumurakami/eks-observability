name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# GitHub Actions free tier optimization:
# - Public repos have unlimited minutes, but limit parallelism to minimize impact on other users
# - Use caching to reduce execution time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [eks, container-insights, managed-prometheus, managed-grafana]
      # Limit parallelism to stay within free tier usage
      max-parallel: 2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.9.0

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: |
            terraform/modules/${{ matrix.module }}/.terraform
            ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('terraform/modules/${{ matrix.module }}/**/*.tf') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: terraform/modules/${{ matrix.module }}

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: terraform/modules/${{ matrix.module }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform/modules/${{ matrix.module }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Cache TFLint plugins
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-${{ hashFiles('terraform/modules/${{ matrix.module }}/.tflint.hcl') }}

      - name: Init TFLint
        run: tflint --init
        working-directory: terraform/modules/${{ matrix.module }}

      - name: Run TFLint
        run: tflint --format compact
        working-directory: terraform/modules/${{ matrix.module }}

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart: [fargate-logging, adot-container-insights, adot-prometheus]
      max-parallel: 2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Helm Lint
        run: helm lint ./helm/${{ matrix.chart }}

      - name: Helm Template (Dry Run with dev values)
        run: |
          helm template test-release ./helm/${{ matrix.chart }} \
            -f ./helm/${{ matrix.chart }}/values/values-dev.yaml \
            --debug

      - name: Validate Kubernetes manifests
        run: |
          helm template test-release ./helm/${{ matrix.chart }} \
            -f ./helm/${{ matrix.chart }}/values/values-dev.yaml \
            | kubectl --dry-run=client -f - apply

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for broken links in Markdown files
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: '.markdown-link-check.json'
          use-quiet-mode: 'yes'

      - name: Validate CLAUDE.md structure
        run: |
          echo "Checking CLAUDE.md for required sections..."

          required_sections=(
            "## Repository Overview"
            "## Project Structure"
            "## Architecture Overview"
            "## Terraform Development"
            "## Helm Development"
          )

          for section in "${required_sections[@]}"; do
            if ! grep -q "$section" CLAUDE.md; then
              echo "ERROR: Missing required section: $section"
              exit 1
            fi
          done

          echo "All required sections found in CLAUDE.md"

      - name: Validate README.md exists
        run: |
          if [ ! -f README.md ]; then
            echo "ERROR: README.md not found"
            exit 1
          fi
          echo "README.md exists"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true  # Warnings only for reference repository
          format: default

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          soft_fail: true
          quiet: true
          output_format: cli
          # Report only critical issues for reference repository
          compact: true

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [terraform-validate, helm-lint, documentation, security]
    if: always()
    steps:
      - name: Check overall status
        run: |
          echo "## CI Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.terraform-validate.result }}" == "success" ]; then
            echo "✅ Terraform validation passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Terraform validation failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.helm-lint.result }}" == "success" ]; then
            echo "✅ Helm lint passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Helm lint failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.documentation.result }}" == "success" ]; then
            echo "✅ Documentation checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Documentation checks failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.security.result }}" == "success" ]; then
            echo "✅ Security scan completed (warnings only)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Security scan had issues" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if critical jobs failed
        if: needs.terraform-validate.result == 'failure' || needs.helm-lint.result == 'failure' || needs.documentation.result == 'failure'
        run: exit 1
